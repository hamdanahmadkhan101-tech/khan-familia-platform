version: 2
updates:
  # Maintain dependencies for npm/pnpm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps): '
    labels:
      - 'dependencies'
      - 'javascript'

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps): '
    labels:
      - 'dependencies'
      - 'actions'
