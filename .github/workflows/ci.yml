name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Mock environment variables required for Next.js build
    env:
      NEXT_PUBLIC_APP_NAME: 'Khan Familia Platform'
      NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3001'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'pk_test_mock'
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: 'pk_test_mock'
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: 'mock_cloud'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency consistency
        run: pnpm run lint:deps

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
